name: Publish npm package

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        # The dependency audit is not part of publishing and can stall on its
        # separate registry endpoint; tests below remain the release gate.
        run: npm ci --no-audit

      - name: Test
        run: npm test

      - name: Use Node.js for Trusted Publishing
        uses: actions/setup-node@v6
        with:
          # npm Trusted Publishing requires Node.js 22.14 or newer.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check whether this version is already published
        id: package
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.package.outputs.should_publish == 'true'
        run: npm publish --provenance
